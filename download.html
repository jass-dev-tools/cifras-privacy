<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Descargar Cifras y Letras</title>
    <meta
      name="description"
      content="Descarga Cifras y Letras en App Store o Google Play."
    />
    <style>
      :root {
        --bg-top: #0d2d73;
        --bg-bottom: #09152f;
        --panel: rgba(10, 21, 47, 0.78);
        --panel-border: rgba(139, 228, 255, 0.28);
        --text: #f6fbff;
        --muted: #bfd5ff;
        --accent: #ffd54f;
        --accent-2: #8be4ff;
        --button-dark: #123885;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(139, 228, 255, 0.16), transparent 30%),
          linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 560px);
        padding: 32px 24px;
        border-radius: 28px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        text-align: center;
        backdrop-filter: blur(12px);
      }

      .logo {
        width: 120px;
        max-width: 36vw;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 2.8rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.5;
      }

      .status {
        margin: 18px 0 0;
        font-weight: 700;
        color: var(--accent);
      }

      .actions {
        display: grid;
        gap: 12px;
        margin-top: 28px;
      }

      .button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 56px;
        padding: 14px 18px;
        border-radius: 18px;
        text-decoration: none;
        font-weight: 800;
        transition:
          transform 160ms ease,
          opacity 160ms ease,
          box-shadow 160ms ease;
      }

      .button:hover {
        transform: translateY(-1px);
        opacity: 0.96;
      }

      .button.primary {
        color: #0d1b2a;
        background: linear-gradient(180deg, #ffe486, var(--accent));
        box-shadow: 0 12px 30px rgba(255, 213, 79, 0.28);
      }

      .button.secondary {
        color: var(--text);
        background: rgba(18, 56, 133, 0.64);
        border: 1px solid rgba(139, 228, 255, 0.36);
      }

      .note {
        margin-top: 18px;
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img
        class="logo"
        src="logo_cifrasyletras.png"
        alt="Logo de Cifras y Letras"
      />
      <h1>Descarga Cifras y Letras</h1>
      <p>
        Si estás en móvil intentaremos abrir directamente tu tienda. Si no,
        puedes elegir manualmente aquí abajo.
      </p>
      <p class="status" id="status">Detectando plataforma...</p>

      <div class="actions">
        <a
          class="button primary"
          id="ios-link"
          href="https://apps.apple.com/es/app/id6761785428"
        >
          Descargar en App Store
        </a>
        <a
          class="button secondary"
          id="android-link"
          href="https://play.google.com/store/apps/details?id=com.jassdev.cifrasyletras"
        >
          Descargar en Google Play (Pronto)
        </a>
      </div>

      <p class="note">
        Si la redirección automática no funciona, usa uno de los botones.
      </p>
    </main>

    <script>
      const IOS_URL = "https://apps.apple.com/app/idTU_APPLE_APP_ID";
      const ANDROID_URL =
        "https://play.google.com/store/apps/details?id=com.jassdev.cifrasyletras";
      const FALLBACK_DELAY_MS = 900;

      const statusNode = document.getElementById("status");
      const userAgent = navigator.userAgent.toLowerCase();

      const isAndroid = userAgent.includes("android");
      const isIOS =
        /iphone|ipad|ipod/.test(userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      function redirectTo(url, label) {
        statusNode.textContent = `Redirigiendo a ${label}...`;
        window.location.replace(url);
      }

      if (isAndroid) {
        statusNode.textContent = "Android detectado. Abriendo Google Play...";
        setTimeout(() => redirectTo(ANDROID_URL, "Google Play"), FALLBACK_DELAY_MS);
      } else if (isIOS) {
        statusNode.textContent = "iPhone o iPad detectado. Abriendo App Store...";
        setTimeout(() => redirectTo(IOS_URL, "App Store"), FALLBACK_DELAY_MS);
      } else {
        statusNode.textContent =
          "No hemos detectado una plataforma móvil. Elige tu tienda.";
      }
    </script>
  </body>
</html>
